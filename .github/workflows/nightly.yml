name: Nightly

on:
  push:
    branches: [nightly]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/nightly.yml"
      - ".github/scripts/**"
      - ".swiftlint.yml"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  COPPICE_MIN_SDK: "27"

defaults:
  run:
    working-directory: apps/desktop

jobs:
  test:
    name: Test (swift test)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Coppice CI"
      - name: Run tests
        run: swift test

  lint:
    name: Quality (SwiftLint)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install swiftlint
      - name: Lint
        working-directory: .
        run: swiftlint --strict --reporter github-actions-logging

  publish:
    name: Build and publish nightly
    runs-on: xcode-27
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Set up stable code-signing certificate
        env:
          MACOS_SIGN_CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-signing.sh"

      - name: Build app and installer
        run: |
          export COPPICE_VERSION="$VERSION"
          export COPPICE_BUILD="$BUILD"
          export COPPICE_CHANNEL=nightly
          ./build.sh
          ./make-dmg.sh

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly build/Coppice-Nightly.dmg \
            --title "Coppice Nightly $VERSION (build $BUILD)" \
            --notes "Rolling pre-release from \`nightly\` at ${GITHUB_SHA:0:7}. Build $BUILD." \
            --prerelease \
            --target "$GITHUB_SHA"

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN not set — skipping cask bump."
            exit 0
          fi
          VERSION="$BUILD" CASK=coppice-nightly \
            bash "$GITHUB_WORKSPACE/.github/scripts/bump-cask.sh" "$PWD/build/Coppice-Nightly.dmg"
