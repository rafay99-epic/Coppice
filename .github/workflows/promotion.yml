name: Promote nightly to stable

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be promoted without pushing"
        type: boolean
        default: true

concurrency:
  group: promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote nightly to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect the changelog
        id: changelog
        run: |
          git fetch origin refs/heads/nightly:refs/remotes/origin/nightly
          if git diff --quiet main origin/nightly; then
            echo "::notice::main already matches nightly. Nothing to promote."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
          since="$(git log -1 --format='%(trailers:key=Promoted-from,valueonly)' main | tr -d '[:space:]')"
          if [ -n "$since" ] && git cat-file -e "$since^{commit}" 2>/dev/null; then
            changes="$(git log --no-merges --pretty='- %s' "$since..origin/nightly")"
          else
            changes="$(git log --no-merges --pretty='- %s' --since="$(git log -1 --format=%cI main)" origin/nightly)"
          fi
          {
            echo "release: promote nightly $(git rev-parse --short origin/nightly)"
            echo
            echo "## What changed"
            echo
            echo "$changes"
            echo
            echo "Promoted-from: $(git rev-parse origin/nightly)"
          } > /tmp/notes.md
          echo "--- promotion notes ---"
          cat /tmp/notes.md

      - name: Promote
        if: steps.changelog.outputs.empty == 'false' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git commit-tree "origin/nightly^{tree}" -p main -F /tmp/notes.md)"
          git push origin "$commit:refs/heads/main"

          gh workflow run ci.yml --ref main
          echo "::notice::Promoted nightly to main and started the release build."

      - name: Dry run summary
        if: steps.changelog.outputs.empty == 'false' && inputs.dry_run == true
        run: |
          echo "::notice::Dry run. Re-run with dry_run unchecked to promote."
          cat /tmp/notes.md >> "$GITHUB_STEP_SUMMARY"
