name: Promote nightly to stable

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would be promoted without pushing"
        type: boolean
        default: true

concurrency:
  group: promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Squash nightly into main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect the changelog
        id: changelog
        run: |
          git fetch origin nightly:nightly
          if git diff --quiet main nightly; then
            echo "::notice::main already matches nightly — nothing to promote."
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
          {
            echo "## What changed"
            echo
            git log --no-merges --pretty="- %s" main..nightly
          } > /tmp/notes.md
          echo "--- promotion notes ---"
          cat /tmp/notes.md

      - name: Promote
        if: steps.changelog.outputs.empty == 'false' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge --squash nightly
          if git diff --cached --quiet; then
            echo "::error::squash staged nothing, so there is nothing to promote"
            exit 1
          fi
          git commit --file /tmp/notes.md
          git push origin main

          gh workflow run ci.yml --ref main
          echo "::notice::Promoted nightly → main and started the release build."

      - name: Dry run summary
        if: steps.changelog.outputs.empty == 'false' && inputs.dry_run == true
        run: |
          echo "::notice::Dry run. Re-run with dry_run unchecked to promote."
          cat /tmp/notes.md >> "$GITHUB_STEP_SUMMARY"
