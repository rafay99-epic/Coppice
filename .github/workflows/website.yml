name: Website

# The site has its own workflow so a copy change never triggers a macOS runner,
# and a desktop change never rebuilds the site.
on:
  push:
    branches: [main, nightly]
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"
      - "package.json"
      - "turbo.json"
  pull_request:
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run --filter=website lint
      - name: Build
        run: bun run --filter=website build
      - name: Upload static site
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: apps/website/out
