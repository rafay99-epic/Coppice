name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - ".swiftlint.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - ".swiftlint.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COPPICE_MIN_SDK: "27"

defaults:
  run:
    working-directory: apps/desktop

jobs:
  test:
    name: Test (swift test)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Coppice CI"
      - name: Run tests
        run: swift test

  lint:
    name: Quality (SwiftLint)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        working-directory: .
        run: swiftlint --strict --reporter github-actions-logging

  package:
    name: Build & package DMG
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Build app and installer
        env:
          UNSIGNED: "1" # PR packaging check; no signing secrets here and this DMG never ships
        run: |
          ./build.sh
          ./make-dmg.sh
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Coppice-dmg
          path: apps/desktop/build/Coppice.dmg

  release:
    name: Build and publish release
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: xcode-27
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        run: echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Developer ID signing + notarization (setup-signing.sh). Trusted context
      # only: this job runs on `main` only, never a fork PR, so the secrets can't leak.
      # Missing secrets fail the run; there is no ad-hoc fallback.
      - name: Set up Developer ID signing and notarization
        env:
          MACOS_SIGN_CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-signing.sh"

      - name: Build app and installer
        run: |
          export COPPICE_VERSION="$VERSION"
          ./build.sh
          ./make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Coppice.dmg \
            --title "Coppice $VERSION" \
            --generate-notes

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN not set — skipping cask bump."
            exit 0
          fi
          CASK=coppice bash "$GITHUB_WORKSPACE/.github/scripts/bump-cask.sh" "$PWD/build/Coppice.dmg"
