name: CI

# Desktop-app CI and release in one pipeline, so the build users receive is the
# exact one that passed every check. Test and lint are the gate: on `main` the
# release builds and publishes only after both pass; on PRs the DMG builds and
# uploads as an artifact instead. The release-config compile happens inside
# those build steps (build.sh), so no separate job recompiles the same thing.
#
# Why not a separate release workflow: two workflows each run their own
# `swift test`, and a flaky test can pass in one while failing the other, which
# is how a red build reaches users. Here one test run gates the publish step.
on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - ".swiftlint.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/ci.yml"
      - ".github/scripts/**"
      - ".swiftlint.yml"

# PRs cancel superseded runs; main never cancels, so pushes serialize and two
# releases cannot race to publish the same version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/desktop

jobs:
  test:
    name: Test (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      # The verdict tests build real git repositories, and git refuses to commit
      # without an identity.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Coppice CI"
      - name: Run tests
        run: swift test

  lint:
    name: Quality (SwiftLint)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        working-directory: .
        run: swiftlint --strict --reporter github-actions-logging

  # PR only: build and package the DMG so a reviewer can install the change.
  # This IS the release-config build check — build.sh runs the arm64 release
  # build, so a separate job would just compile the same thing again.
  package:
    name: Build & package DMG
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v5
      - name: Build app and installer
        run: |
          ./build.sh
          ./make-dmg.sh
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: Coppice-dmg
          path: apps/desktop/build/Coppice.dmg

  # main only: build and publish the GitHub Release (version = commit count).
  # `needs: [test, lint]` gates it, so if either fails this job is skipped and
  # nothing is built or published. A failing build.sh here fails the job before
  # `gh release create` runs, so a broken compile cannot publish either.
  release:
    name: Build and publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    needs: [test, lint]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history — the version is the commit count

      - name: Compute version
        run: echo "VERSION=0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Import the stable self-signed cert so this release shares one signature
      # with every prior release, and users keep their Full Disk Access grant
      # across the auto-update. Push-to-main only, so a fork PR never reaches
      # here and the secret cannot leak. No secret means an ad-hoc build.
      - name: Set up stable code-signing certificate
        env:
          MACOS_SIGN_CERT_P12: ${{ secrets.MACOS_SIGN_CERT_P12 }}
          MACOS_SIGN_CERT_PASSWORD: ${{ secrets.MACOS_SIGN_CERT_PASSWORD }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup-signing.sh"

      - name: Build app and installer
        run: |
          export COPPICE_VERSION="$VERSION"
          ./build.sh
          ./make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/Coppice.dmg \
            --title "Coppice $VERSION" \
            --generate-notes

      # Keep the Homebrew cask in sync. The stable `coppice` cask is
      # version-pinned, so this pushes the new version and DMG sha256 to the tap.
      # Needs a TAP_TOKEN secret; skips with a warning if absent so a missing
      # secret never fails the release.
      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN not set — skipping cask bump."
            exit 0
          fi
          CASK=coppice bash "$GITHUB_WORKSPACE/.github/scripts/bump-cask.sh" "$PWD/build/Coppice.dmg"
